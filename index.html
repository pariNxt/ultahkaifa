<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love with Touch Audio and Redirect Button</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 80px;
            pointer-events: none;
        }

        .theme-btn {
            pointer-events: auto;
            position: relative;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffb6c1;
            background: rgba(10, 0, 5, 0.6);
            border: 2px solid #ffb6c1;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.3),
                        inset 0 0 15px rgba(255, 182, 193, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseGlow 3s infinite alternate;
        }

        .theme-btn:hover {
            color: #ffffff;
            background: rgba(255, 182, 193, 0.25);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 182, 193, 0.8),
                        0 0 50px rgba(255, 105, 180, 0.5),
                        inset 0 0 20px rgba(255, 182, 193, 0.4);
            transform: translateY(-3px) scale(1.05);
        }

        .theme-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 12px rgba(255, 182, 193, 0.3), inset 0 0 10px rgba(255, 182, 193, 0.1);
            }
            100% {
                box-shadow: 0 0 22px rgba(255, 182, 193, 0.6), inset 0 0 18px rgba(255, 182, 193, 0.25);
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <button class="theme-btn" onclick="handleClick()">Click Me ❤️</button>
    </div>

    <!-- Library Eksternal -->
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>

    <!-- Script Utama -->
    <script>
        const cvs = document.getElementById("canvas");
        const pen = cvs.getContext("2d");
        const noise = new SimplexNoise();

        let width, height, time;

        // --- Konfigurasi Audio Touch/Click ---
        const AUDIO_URL = "https://files.catbox.moe/u6ewqg.mp4a";
        const bgMusic = new Audio(AUDIO_URL);
        bgMusic.loop = true;

        let isAudioPlaying = false;

        function startAudioOnTouch() {
            if (!isAudioPlaying) {
                bgMusic.play().then(() => {
                    isAudioPlaying = true;
                    window.removeEventListener("touchstart", startAudioOnTouch);
                    window.removeEventListener("click", startAudioOnTouch);
                }).catch(err => {
                    console.log("Menunggu interaksi pengguna...", err);
                });
            }
        }

        window.addEventListener("touchstart", startAudioOnTouch);
        window.addEventListener("click", startAudioOnTouch);

        // --- Canvas Animation ---
        function initCanvas() {
            width = cvs.width = window.innerWidth;
            height = cvs.height = window.innerHeight;
            pen.fillRect(0, 0, width, height);
            pen.fillStyle = "rgba(0, 0, 0, 0.02)";
            pen.strokeStyle = "pink";
            pen.lineWidth = 2;
        }

        function heartShape(centerX, centerY, scale) {
            pen.beginPath();
            const noiseZoom = 0.03;
            const noiseStrength = 0.08 * scale;
            const step = 0.01;

            for (let t = 0; t < Math.PI * 2; t += step) {
                const cosT = Math.cos(t);
                const sinT = Math.sin(t);

                const distortion = noise.noise3D(
                    cosT / noiseZoom,
                    sinT / noiseZoom,
                    time + scale * 100
                ) * noiseStrength;

                const radius = scale + distortion;

                const px = radius * 16 * Math.pow(sinT, 3);
                const py = -radius * (
                    13 * Math.cos(t)
                    - 5 * Math.cos(2 * t)
                    - 2 * Math.cos(3 * t)
                    - Math.cos(4 * t)
                );

                pen.lineTo(centerX + px, centerY + py);
            }

            pen.stroke();
        }

        function render(timestamp) {
            requestAnimationFrame(render);
            time = timestamp / 1000;

            pen.fillRect(0, 0, width, height);

            const layers = 6;
            const centerY = height / 2 - 30; 
            for (let i = 1; i <= layers; i++) {
                const scale = Math.min(width, height) * 0.0038 * i;
                heartShape(width / 2, centerY, scale);
            }
        }

        // --- Fungsi Klik Tombol ---
        function handleClick() {
            const targetUrl = "https://love.tsonit.com/rpkm01j0baq4jy1s"; 
            
            // Menggunakan window.open agar halaman baru terbuka di tab terpisah,
            // sehingga musik di tab utama ini tidak terhenti.
            window.open(targetUrl, "https://files.catbox.moe/u6ewqg.m4a");
        }

        initCanvas();
        window.addEventListener("resize", initCanvas);
        requestAnimationFrame(render);
    </script>
</body>

</html>
